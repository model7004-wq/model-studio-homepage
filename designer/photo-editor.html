<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>모델스튜디오 업무노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@700&display=swap">
<style>
/* 레이아웃: 휴대폰 한 손 조작 — 상단 날짜·이름, 본문 카드 목록, 하단 고정 탭 5개 */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --sunk:#E3E6EC; --ink:#1A1D24; --soft:#5F6675; --line:#D5D9E1;
  --accent:#2F4F9A; --accent-soft:#DCE4F5; --onaccent:#FFFFFF; --mark:#F3D46B;
  --ok:#2E7D57; --ok-soft:#DAEFE3; --warn:#B26A00; --warn-soft:#FCEBCB; --bad:#B4372F; --bad-soft:#F8DEDB;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif; --f-disp:"Gowun Batang",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13161C; --surface:#1D2129; --sunk:#262B35; --ink:#E9ECF2; --soft:#9AA2B2; --line:#2F3542;
  --accent:#8FAAE8; --accent-soft:#273556; --onaccent:#0F1420; --mark:#C9A73A;
  --ok:#6CC596; --ok-soft:#1E3A2B; --warn:#E5A84A; --warn-soft:#3D2E14; --bad:#EE8A80; --bad-soft:#43231F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161C; --surface:#1D2129; --sunk:#262B35; --ink:#E9ECF2; --soft:#9AA2B2; --line:#2F3542;
  --accent:#8FAAE8; --accent-soft:#273556; --onaccent:#0F1420; --mark:#C9A73A;
  --ok:#6CC596; --ok-soft:#1E3A2B; --warn:#E5A84A; --warn-soft:#3D2E14; --bad:#EE8A80; --bad-soft:#43231F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.page{max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* 상단 */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:18px 0 14px;flex-wrap:wrap}
.top .date{font-family:var(--f-disp);font-size:24px;line-height:1.2}
.top .studio{color:var(--soft);font-size:13px}
.me{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px}
.me select{border:0;background:transparent;font-weight:600;padding:4px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}

/* 공통 */
.sec{margin-top:22px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.sec-h h2{font-size:17px;font-weight:700}
.sec-h .count{color:var(--soft);font-weight:500;font-size:14px;margin-left:4px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:4px}
.box{background:var(--surface);border-radius:16px;padding:16px}
.list{display:grid;gap:8px}
.item{background:var(--surface);border-radius:14px;padding:13px 14px;display:grid;gap:6px;min-width:0}
.item.done{opacity:.55}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.grow{flex:1;min-width:0}
.title{font-weight:600;overflow-wrap:anywhere}
.muted{color:var(--soft);font-size:13px}
.body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--soft);white-space:nowrap}
.chip.blue{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
button.chip{border:0}
.edit{background:none;border:0;color:var(--soft);font-size:13px;padding:4px 2px}
.empty{color:var(--soft);font-size:14px;padding:18px 14px;text-align:center;background:var(--surface);border-radius:14px;border:1px dashed var(--line)}
.check{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on::after{content:"";width:10px;height:6px;border:2.5px solid var(--onaccent);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.add{width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:12px;color:var(--accent);font-weight:600}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-weight:600;color:var(--soft);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* 출퇴근 */
.clock{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clock button{border:0;border-radius:14px;padding:16px 10px;font-weight:700;font-size:17px;display:grid;gap:2px}
.clock .in{background:var(--accent);color:var(--onaccent)}
.clock .out{background:var(--ink);color:var(--bg)}
.clock button small{font-weight:500;font-size:13px;opacity:.8}
.clock button[disabled]{background:var(--sunk);color:var(--soft);cursor:default}
/* 꼭 해야 할 3가지 */
.must{display:grid;gap:8px}
.must .slot{display:flex;align-items:center;gap:10px}
.must .num{width:24px;height:24px;flex:none;border-radius:50%;background:var(--mark);color:#1A1D24;display:grid;place-items:center;font-weight:700;font-size:13px}
.must input.mustin{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 2px}
.must .slot.on input.mustin,.must .slot.on .t{text-decoration:line-through;color:var(--soft)}
.others{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:10px}
.others .item .t{font-size:14px}
.staffline{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* 진행 단계 */
.steps{display:flex;gap:3px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--sunk)}
.steps i.on{background:var(--accent)}
.steps i.now{background:var(--mark)}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px}
.spec div{background:var(--sunk);border-radius:10px;padding:7px 10px}
.spec dt{font-size:11px;color:var(--soft)}
.spec dd{margin:0;font-weight:700;font-size:14px}
.next{border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:6px 12px;font-weight:600;font-size:13px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--surface);border-radius:14px;padding:12px}
.sum b{display:block;font-size:19px}
.sum span{font-size:12px;color:var(--soft)}
.dategroup{font-size:13px;font-weight:700;color:var(--soft);margin:12px 2px 2px}
details>summary{cursor:pointer;color:var(--soft);font-size:14px;padding:8px 2px}

/* 출퇴근 기록표 */
.tablewrap{overflow-x:auto;background:var(--surface);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--soft);font-weight:600;background:var(--sunk)}

/* 하단 탭 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{border:0;background:none;padding:9px 0;font-weight:600;font-size:14px;color:var(--soft);border-radius:10px}
.nav button.on{color:var(--accent);background:var(--accent-soft)}

/* 입력 시트 */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(10,12,18,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{font-size:18px;margin-bottom:12px}
.fld{display:grid;gap:4px;margin-bottom:12px}
.fld label,.fld .lab{font-size:13px;font-weight:600;color:var(--soft)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.fld textarea{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{display:block}
.radios input{position:absolute;width:1px;height:1px;padding:0;opacity:0;pointer-events:none}
.radios span{display:block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--soft)}
.radios input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.radios input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.acts{display:flex;gap:8px;margin-top:6px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700}
.btn.pri{background:var(--accent);color:var(--onaccent);flex:1}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.del{background:var(--bad-soft);color:var(--bad)}
.ybstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.ybstat button{border:0;background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;display:grid;gap:2px;min-height:64px}
.ybstat b{font-size:20px}.ybstat span{font-size:12px;color:var(--soft)}
.ybstat button.on{box-shadow:inset 0 0 0 2px var(--accent)}
.ybstat button.alarm{background:var(--bad-soft)}.ybstat button.alarm b,.ybstat button.alarm span{color:var(--bad)}
.ybtools{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.ybtools input,.ybtools select{min-width:0;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
.ybtools input{grid-column:1/-1}
.ybbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:60px}
.ybbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.ybwrap{overflow-x:auto;background:var(--surface);border-radius:14px}
.ybt{border-collapse:collapse;width:100%;min-width:960px;font-size:14px}
.ybt th{text-align:left;font-size:12px;font-weight:600;color:var(--soft);padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.ybt td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ybt tbody tr{cursor:pointer}.ybt tbody tr:last-child td{border-bottom:0}
.yblink{border:0;background:none;padding:0;font-weight:700;text-align:left;color:var(--accent);min-height:32px}
.ybpgt{min-width:120px;border:1px solid transparent;background:var(--sunk);border-radius:8px;padding:7px 10px}
.ybno{white-space:nowrap}
.ybpg,.ybpg .ybros{grid-template-columns:minmax(0,1fr)}.ybver{grid-template-columns:minmax(0,1fr)}
.ybpg select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:40px;max-width:100%;min-width:0}
.ybthumb{border:0;padding:0;background:none;width:44px;height:44px;border-radius:8px;overflow:hidden;flex:none}
.ybthumb img{width:100%;height:100%;object-fit:cover;display:block}
.ybthumb.big{width:100%;height:auto;aspect-ratio:4/5}
.ybcmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ybcmp figure{margin:0;display:grid;gap:4px}.ybcmp figcaption{font-size:12px;color:var(--soft);text-align:center}
.ybver{display:grid;gap:4px;padding-bottom:8px;border-bottom:1px solid var(--line);min-width:0}
.ybpath{font-size:13px;background:var(--sunk);border-radius:8px;padding:6px 8px;overflow-wrap:anywhere;user-select:all}
.ybwarn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.ybstat.ybm4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.ybm4>div{min-width:0}.ybm4 b{overflow-wrap:anywhere}.ybm4 span{font-size:12px;color:var(--soft)}.ybm4>div{background:var(--surface);border-radius:14px;padding:12px;display:grid;gap:2px}.ybm4>div.alarm{background:var(--bad-soft)}.ybm4 b{font-size:18px}
.ybm{padding:6px 0;border-bottom:1px solid var(--line)}.ybm:last-of-type{border-bottom:0}
.ybbulk .btn{min-height:44px}.ybtools.ybbulk input{grid-column:auto}
.ybtg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-weight:600;font-size:14px;min-height:40px}
.ybtg.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.ybros{display:grid;gap:8px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.ybstu{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 8px;align-items:center}
.ybstu input{grid-column:1/-1;grid-row:2;min-width:0;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:14px}
.ybckt{min-width:0;border:0;background:transparent;padding:6px 4px}
.ybres{display:grid;gap:8px;margin-top:12px;justify-items:start}
.ybres .fold{background:var(--sunk);width:100%;padding:0 12px}.ybchk summary{min-height:44px;padding:8px 0}.ybchk ul{margin:0;padding:0 0 10px 18px;font-size:14px}
@media (min-width:900px){.page.wide{max-width:1180px}}
@media (max-width:480px){.ybstat:not(.ybm4){grid-template-columns:repeat(4,1fr);gap:6px}.ybstat.ybm4{grid-template-columns:repeat(2,minmax(0,1fr))}.ybstat button{padding:8px;min-height:54px;align-content:start}.ybstat b{font-size:17px}.ybstat span{font-size:11px;line-height:1.3}}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
/* 첨부 파일 */
.files{display:flex;flex-wrap:wrap;gap:6px}
.thumb{width:64px;height:64px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;font-size:11px;color:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.fchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;background:var(--sunk);color:var(--ink);text-decoration:none;border-radius:10px;padding:6px 10px;font-size:13px}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.fchip b,.frow .pdf{font-size:10px;font-weight:700;background:var(--bad-soft);color:var(--bad);border-radius:5px;padding:1px 5px;flex:none}
.flist{display:grid;gap:6px;margin-bottom:8px}
.frow{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14px;overflow-wrap:anywhere}
.frow img{width:44px;height:44px;object-fit:cover;border-radius:8px;flex:none}
.drop{display:block;position:relative;text-align:center;border:1.5px dashed var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px;font-weight:600;cursor:pointer}
.fld .drop input{position:absolute;opacity:0;width:1px;height:1px;padding:0;border:0}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.lb img{max-width:100%;max-height:80vh;object-fit:contain;border-radius:8px}
.lb a,.lb button{color:#fff;background:rgba(255,255,255,.15);border:0;border-radius:10px;padding:8px 14px;font-weight:600;text-decoration:none}
/* 촬영 컨셉 추천 */
.ccs{display:grid;gap:6px}
.cc{background:var(--sunk);border-radius:12px;padding:0 12px}
.cc>summary{padding:11px 0;color:var(--ink);font-size:15px;list-style-position:inside}
.cc[open]{padding-bottom:12px}
.ccd{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0 0 10px;font-size:14px}
.ccd dt{color:var(--soft);font-weight:600}
.ccd dd{margin:0;overflow-wrap:anywhere}
.picked{background:var(--accent-soft);border-radius:12px;padding:10px 12px}
/* 홍보: 블로그 글·인스타 릴스 */
.acts2{display:flex;flex-wrap:wrap;gap:8px}
.acts2 .btn{flex:1 1 150px;padding:11px 12px;font-size:14px;min-height:46px}
/* 접었다 펴는 칸: 제목 줄 전체를 눌러 펼치기 */
details.smile>summary{display:flex;align-items:center;gap:8px;list-style:none;cursor:pointer}details.smile>summary::-webkit-details-marker{display:none}details.smile[open] summary .muted{visibility:hidden}details.smile .body{margin-top:8px;font-weight:700;color:var(--accent)}
.fold{background:var(--surface);border-radius:16px;padding:0 16px}
.fold>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0;min-height:52px;list-style:none;color:var(--ink)}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary h2{font-size:17px;font-weight:700}
.fold>summary::after{content:"";width:9px;height:9px;flex:none;border-right:2px solid var(--soft);border-bottom:2px solid var(--soft);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
.fold[open]>summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.fold[open]>summary .muted{display:none}
.fold[open]{padding-bottom:14px}
.fold .count{margin-left:6px;color:var(--soft);font-weight:500;font-size:14px}
.fold .list .item{background:var(--sunk)}
.fold .igref{background:var(--surface)}
.refs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.igref{display:flex;align-items:center;gap:6px;min-width:0;min-height:44px;padding:8px 10px;border-radius:10px;background:var(--sunk);color:var(--accent);font-weight:600;text-decoration:none;overflow:hidden}
.igref .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
@media (max-width:380px){.refs{grid-template-columns:1fr}}
.thumb.cv{width:150px;height:200px}
.gen{background:var(--sunk);border-radius:12px;padding:12px;display:grid;gap:6px}
.copyrow{display:flex;gap:6px;flex-wrap:wrap}
.reel{display:grid;gap:10px;justify-items:center;background:var(--sunk);border-radius:12px;padding:12px}
.reel video{width:min(240px,100%);aspect-ratio:9/16;border-radius:10px;background:#000}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}

const shiftOf=n=>(S.config.hours||{})[n]||{};
const isLate=(n,a)=>{const s=shiftOf(n).start;return !!(s&&a&&a.in&&hm2m(a.in)>hm2m(s))};
const isEarly=(n,a)=>{const e=shiftOf(n).end;return !!(e&&a&&a.out&&hm2m(a.out)<hm2m(e))};
const mustOf=(d,n)=>{const a=((S.must[d]||{})[n])||[];return [0,1,2].map(i=>Object.assign({text:'',done:false},a[i]||{}))};
// 첨부 파일: db 에는 asset id 만 저장하고 주소는 "/_blob/"+id 로 만듭니다
const blob=id=>/^[0-9a-f]{32}$/.test(id||'')?'/_blob/'+id:'';
const filesOf=x=>(x&&Array.isArray(x.files)?x.files:[]).filter(f=>f&&blob(f.id));
const telA=p=>p?`<a class="tel" href="tel:${esc(String(p).replace(/[^\d+]/g,''))}">${esc(p)}</a>`:''; // 휴대폰에서 누르면 바로 전화
const isImg=f=>/^image\//.test(f.type||'');
const isVid=f=>/^video\//.test(f.type||'');
const fsize=n=>!n?'':n>=1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round(n/1024))+'KB';
function fileList(x){const a=filesOf(x);if(!a.length)return'';

    :`<a class="fchip" href="${blob(f.id)}" target="_blank" rel="noopener"><b>${isVid(f)?'영상':'PDF'}</b><span>${esc(f.name)}</span></a>`).join('')}</div>`}

  if(!S.config.staff.length) h+=`<p class="muted">관리 탭에서 직원 이름을 먼저 등록해 주세요.</p>`;
  else if(!S.me) h+=`<p class="muted">내 이름을 누르면 출퇴근을 찍을 수 있어요. 이 휴대폰에 기억돼요.</p><div class="pick">${S.config.staff.map(n=>`<button data-act="pickme" data-v="${esc(n)}">${esc(n)}</button>`).join('')}</div>`;
  else h+=`<div class="clock">
    <button class="in" data-act="stamp" data-v="in" ${mine.in||S.readOnly?'disabled':''}>${mine.in?'출근 완료':'출근하기'}<small>${mine.in||nowHM()}</small></button>
    <button class="out" data-act="stamp" data-v="out" ${!mine.in||mine.out||S.readOnly?'disabled':''}>${mine.out?'퇴근 완료':'퇴근하기'}<small>${mine.out||(mine.in?nowHM():'출근 후 가능')}</small></button></div>`;
  if(S.me&&shiftOf(S.me).start)h+=`<p class="muted" style="margin-top:8px">내 근무시간 ${shiftOf(S.me).start} ~ ${shiftOf(S.me).end||''}${isLate(S.me,mine)?' · <b style="color:var(--warn)">지각</b>':''}${isEarly(S.me,mine)?' · <b style="color:var(--warn)">조퇴</b>':''}</p>`;
  h+=`<div class="staffline">${S.config.staff.map(n=>{const a=att[n]||{};const r=(S.config.roles||{})[n]?' '+esc(S.config.roles[n]):'';const sh=shiftOf(n);
    const tag=(isLate(n,a)?' · 지각':'')+(isEarly(n,a)?' · 조퇴':'');
    return a.out?`<span class="chip ${tag?'warn':''}">${esc(n)}${r} 퇴근 ${a.out}${tag}</span>`:a.in?`<span class="chip ${tag?'warn':'ok'}">${esc(n)}${r} 출근 ${a.in}${tag}</span>`:`<span class="chip">${esc(n)}${r} 미출근${sh.start?' ('+sh.start+')':''}</span>`}).join('')}</div></div></section>`;

  h+=vMust(t);
  const res=D('reservations').filter(r=>r.date===t&&r.status!==2).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  h+=`<section class="sec">${secH('오늘 예약',res.length,`<button class="link" data-act="go" data-v="cust" data-g="reservations">전체 보기</button>`)}<div class="list">${res.length?res.map(cardRes).join(''):empty('오늘 잡힌 예약이 없어요')}</div></section>`;
  if(res.length)h+=vConcept(res);

  const alerts=[];
  D('deliveries').forEach(d=>{const n=dday(d.due);if((d.stage||0)<DELIV.length-1&&n!=null&&n<=3)alerts.push({n,html:`<span class="chip ${n<0?'bad':'warn'}">${ddTxt(n)}</span><span class="grow title">${esc(d.customer)} 사진 출고</span><span class="muted">${esc(DELIV[d.stage||0])}</span>`})});
  D('albums').forEach(a=>{if(ybDue(a)){const r=ybRisk(a),dn=dday(ybDue(a));if(r&&(r.lv==='over'||dn<=14))alerts.push({n:dn,html:`<span class="chip ${r.cls}">${r.lv==='over'?'기한 초과':'납품 '+ddTxt(dn)}</span><span class="grow title">${esc(a.school)} 졸업앨범</span><span class="muted">${esc(r.txt)}</span>`});return}const n=dday(a.grad);if((a.stage||0)<ALBUM.length-1&&n!=null&&n<=30)alerts.push({n,html:`<span class="chip ${n<7?'bad':'warn'}">${ddTxt(n)}</span><span class="grow title">${esc(a.school)} 졸업앨범</span><span class="muted">${esc(ALBUM[a.stage||0])}</span>`})});
  D('ybPrint').filter(p=>!p.printDone&&p.printDue&&dday(p.printDue)<0).forEach(p=>{const s=D('albums').find(x=>x.id===p.id)||{},n=dday(p.printDue);alerts.push({n,html:`<span class="chip bad">${ddTxt(n)}</span><span class="grow title">${esc(s.school||'')} 인쇄 예정일 지남</span><span class="muted">${esc(p.vendor||'')}</span>`})});
  D('ybRevisions').filter(revLate).forEach(r=>{const p=D('albums').find(x=>x.id===r.projectId)||{},n=dday(r.due);alerts.push({n,html:`<span class="chip bad">${ddTxt(n)}</span><span class="grow title">${esc(p.school||'')} 교정 #${esc(r.no)} 마감 지남</span><span class="muted">${esc(r.designer||'담당 없음')} · ${esc(r.status)}</span>`})});
  D('todos').forEach(d=>{const n=dday(d.due);if(!d.done&&!String(d.id).startsWith('rev_')&&n!=null&&n<0)alerts.push({n,html:`<span class="chip bad">${ddTxt(n)}</span><span class="grow title">${esc(d.text)}</span><span class="muted">${esc(d.owner||'')}</span>`})});
  if(S.mcp&&!S.readOnly){const bk=S.backup,ago=bk&&bk.at?Math.floor((Date.now()-bk.at)/864e5):null;if(ago==null||ago>=7)alerts.push({n:-999,html:`<span class="chip warn">백업</span><span class="grow title">${ago==null?'구글 드라이브에 아직 백업하지 않았어요':ago+'일째 백업을 안 했어요'}</span><button class="next" data-act="go" data-v="set" data-g="">백업하러 가기</button>`})}
  alerts.sort((a,b)=>a.n-b.n);
  if(alerts.length) h+=`<section class="sec">${secH('놓치면 안 되는 일',alerts.length)}<div class="list">${alerts.map(a=>`<div class="item"><div class="row">${a.html}</div></div>`).join('')}</div></section>`;

  const cl=S.clean[t]||{};const done=S.config.areas.filter(a=>cl[a]).length;
  h+=`<section class="sec">${secH('청소 체크',`${done}/${S.config.areas.length}`)}<div class="box"><div class="list">${S.config.areas.map(a=>{const c=cl[a];return `<div class="row"><button class="check ${c?'on':''}" data-act="clean" data-v="${esc(a)}" aria-label="${esc(a)} 청소 ${c?'취소':'완료'}" ${S.readOnly?'disabled':''}></button><span class="grow">${esc(a)}</span>${c?`<span class="muted">${esc(c.by)} ${c.at}</span>`:''}</div>`}).join('')}</div></div></section>`;

  const myT=D('todos').filter(d=>!d.done&&(d.owner===S.me||d.owner==='전체'||!d.owner));
  const dayP=D('plans').filter(p=>p.kind==='일'&&p.date===t);

  return h;

function ccCard(c,id,src,i){
  return `<details class="cc" data-k="${id}-${src}-${i}"><summary><b>${esc(c.name)}</b> <span class="muted">${esc(c.mood)}</span></summary>
  <dl class="ccd"><dt>배경</dt><dd>${esc(c.bg)}</dd><dt>조명</dt><dd>${esc(c.light)}</dd><dt>소품</dt><dd>${esc(c.props)}</dd><dt>의상</dt><dd>${esc(c.outfit)}</dd><dt>포즈</dt><dd>${esc(c.pose)}</dd></dl>
  ${S.readOnly?'':`<button class="next" data-act="cpick" data-id="${id}" data-src="${src}" data-i="${i}">이 컨셉으로 정하기</button>`}</details>`;
}
function vConcept(res){

    const ai=S.ai[r.id]||{},open=S.ccOpen[r.id]||!r.concept;
    let b=`<div class="item"><div class="row"><b>${esc(r.time||'--:--')}</b><span class="grow title">${esc(r.customer)}</span><span class="chip blue">${esc(kindOf(r))}</span></div>`;
    if(r.concept)b+=`<div class="picked"><div class="muted">정한 컨셉</div><p class="body">${esc(r.concept)}</p>${S.readOnly?'':`<button class="link" data-act="ccopen" data-id="${r.id}">${open?'추천 접기':'다른 컨셉 보기'}</button>`}</div>`;
    if(open){
      b+=`<div class="ccs">${baseConcepts(r).map((c,i)=>ccCard(c,r.id,'base',i)).join('')}</div>`;
      if(ai.items)b+=`<div class="muted" style="margin-top:4px">✦ AI 맞춤 추천</div><div class="ccs">${ai.items.map((c,i)=>ccCard(c,r.id,'ai',i)).join('')}</div>`;
      if(ai.err)b+=`<p class="muted" style="color:var(--bad)">${esc(ai.err)}</p>`;
      if(S.sample&&!S.readOnly)b+=`<button class="btn ghost" data-act="aiconcept" data-id="${r.id}" ${ai.loading?'disabled':''}>${ai.loading?'AI가 컨셉을 만드는 중… (10~30초)':ai.items?'✦ AI 추천 다시 받기':'✦ AI 맞춤 추천 받기'}</button>`;
    }
    return b+`</div>`}).join('')}</div></section>`;

const ybAmount=a=>ybCalc(a).contract; // 금액·권수·단가는 직원도 봅니다. 입력과 수정만 대표 계정에서 합니다

const ybPct=a=>{const pr=ybPr(a.id),s=Math.max((a.stage||0)/(ALBUM.length-1)*100,pr&&pr.printDone?92:0),p=ybShotPct(a),d=ybDesignPct(a);return Math.round(p==null&&d==null?s:Math.max(s,(p||0)/2+(d||0)/3))}; // 실제 기록 기준: 촬영이 앞쪽 절반, 디자인이 그다음 1/3. 진행 단계가 더 앞서 있으면 그 값

// 점심 투표: 한 사람이 3가지까지 고르고 오전 10시에 마감합니다. 많이 뽑힌 상위 2가지(같은 표는 함께)를 보여 줍니다. lunch/날짜 문서에 이름별로 저장
const LUNCH_END='10:00',LUNCH_MAX=3,LUNCH_WHO=['방상은','박진희','류미옥','강효심','김진영'],lunchOpen=()=>nowHM()<LUNCH_END;
function lunchVote(v){if(!lunchOpen()){render();return toast('오전 10시에 투표가 끝났어요')}if(!S.me)return toast('위쪽 "나는" 칸에서 이름을 먼저 골라 주세요');if(!LUNCH_WHO.includes(S.me))return toast(`점심 투표는 ${LUNCH_WHO.join(', ')}만 할 수 있어요`);
  const d=today(),cur=((S.lunch||{})[d]||{})[S.me],mine=Array.isArray(cur)?cur:[],next=mine.includes(v)?mine.filter(x=>x!==v):mine.concat(v);
  if(next.length>LUNCH_MAX)return toast(`${LUNCH_MAX}가지까지 고를 수 있어요. 바꾸려면 고른 메뉴를 한 번 더 눌러 빼 주세요`);
  safe(()=>upsertDay('lunch',d,{[S.me]:next}))}
function vLunch(){const n=dayNo(),list=LUNCH.map(([cat,it],i)=>({cat,m:it[(n+i)%it.length]})),day=(S.lunch||{})[today()]||{},open=lunchOpen(),
    voters=LUNCH_WHO.filter(k=>Array.isArray(day[k])&&day[k].length),who=m=>voters.filter(v=>day[v].includes(m)),rank=list.map(x=>({m:x.m[0],n:who(x.m[0]).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n),cut=(rank[1]||rank[0]||{}).n||0,top=rank.filter(x=>x.n>=cut),
    mine=S.me&&Array.isArray(day[S.me])?day[S.me]:[],wait=LUNCH_WHO.filter(s=>!voters.includes(s));
  if(open&&!S.lunchTimer){const[h,m]=LUNCH_END.split(':').map(Number),end=new Date();end.setHours(h,m,0,0);S.lunchTimer=setTimeout(()=>{S.lunchTimer=null;render()},Math.max(1000,end-new Date()))} // 화면을 열어 둔 채 10시가 되면 바로 마감 화면으로
  return `<section class="sec"><div class="box"><b class="title">${open?`한 사람당 ${LUNCH_MAX}가지를 투표해 주세요. 오전 10시까지 골라야 해요.`:'오전 10시에 투표가 끝났어요.'}</b><p class="muted" style="margin-top:4px">${open?'제일 많이 선택된 메뉴 2가지가 점심이 될 가능성이 많아요. 메뉴를 누르면 선택되고, 다시 누르면 빠져요.':'제일 많이 선택된 메뉴 2가지가 점심이 될 가능성이 많아요. 내일 새 메뉴로 다시 투표해요.'}</p></div></section>
  <section class="sec">${secH(open?'지금 많이 선택된 메뉴':'점심이 될 가능성이 많은 메뉴',null,`<span class="chip ${open?'blue':'bad'}">${open?'오전 10시 마감':'투표 마감'}</span>`)}<div class="box">${top.length?top.map(x=>`<div class="row"><b class="grow title">${esc(x.m)}</b><b>${x.n}표</b></div>`).join('')+(top.length>2?`<p class="muted" style="margin-top:6px">표가 같은 메뉴가 있어 ${top.length}가지를 모두 보여 드려요.</p>`:''):`<p class="muted">${open?'아직 투표한 사람이 없어요':'오늘은 투표한 사람이 없어요'}</p>`}<p class="muted" style="margin-top:6px">${voters.length}명 투표${S.isBoss&&wait.length?` ·${open?'아직 안 한 사람':'투표 안 한 사람'}: ${esc(wait.join(', '))}`:''}</p></div></section>
  <section class="sec">${secH('오늘의 메뉴',list.length,open?`<span class="muted">내 선택 ${mine.length}/${LUNCH_MAX}</span>`:'')}<div class="list">${list.map(x=>{const on=mine.includes(x.m[0]),w=who(x.m[0]);return `<button class="item lunchv ${on?'on':''}" data-act="lunchvote" data-v="${esc(x.m[0])}" aria-pressed="${on}" ${open?'':'disabled'}><div class="row"><span class="chip blue">${esc(x.cat)}</span><span class="grow title">${esc(x.m[0])}</span>${on?'<span class="chip ok">내 선택</span>':''}<b>${w.length}표</b></div><p class="body muted">${esc(x.m[1])}${S.isBoss&&w.length?' · '+esc(w.join(', ')):''}</p></button>`}).join('')}</div></section>`}
function vSmile(){const n=dayNo(),sm=S.smile&&S.smile.date===today()?S.smile:null,busy=S.smileBusy;
  const jk=pick3(JOKES,n).map(([q,a])=>({q,a})).concat(sm&&sm.jokes||[]),tp=pick3(TIPS,n).map(([t,d])=>({t,d})).concat(sm&&sm.tips||[]);
  let h=`<section class="sec">${secH('오늘의 웃음 이야기',jk.length)}<div class="list">${jk.map((j,i)=>`<details class="item smile"><summary><span class="chip warn">${i<3?'웃음 '+(i+1):'AI'}</span><span class="grow title">${esc(j.q)}</span><span class="muted">정답 보기</span></summary><p class="body">${esc(j.a)}</p></details>`).join('')}</div></section>`;
  h+=`<section class="sec">${secH('오늘의 행복 비법',tp.length)}<div class="list">${tp.map((t,i)=>`<div class="item"><div class="row"><span class="chip ok">${i<3?'비법 '+(i+1):'AI'}</span><span class="grow title">${esc(t.t)}</span></div><p class="body">${esc(t.d)}</p></div>`).join('')}</div>
    <p class="muted" style="margin-top:8px">매일 아침 새 이야기 3개, 새 비법 3개로 바뀌어요. 모든 직원이 같은 날 같은 이야기를 봐요.</p>
    ${S.sample&&!S.readOnly&&!sm?`<button class="btn ghost" data-act="smileai" ${busy?'disabled':''} style="margin-top:8px">${busy?'AI가 이야기를 고르는 중…':'✦ AI에게 오늘 이야기 3개 더 받기'}</button>`:''}</section>`;
  return h}
async function smileAI(){if(!S.sample||S.smileBusy)return;S.smileBusy=true;render();
  try{const out=await S.sample.json(`사진관 직원들이 아침에 함께 보며 웃을 한국어 이야기를 만들어 주세요. 사진관(가족사진·아기사진·졸업사진) 이야기가 섞이면 좋아요. 누구도 놀리거나 깎아내리지 않는 깨끗한 말장난·아재개그로.
JSON으로만 답하세요: {"jokes":[{"q":"질문","a":"정답 (짧게)"}] 3개, "tips":[{"t":"행복해지는 비법 제목 (15자 이내)","d":"한두 문장 설명"}] 3개}. 오늘 날짜: ${today()}`,{cache:false});
    const cl=(a,k1,k2)=>(Array.isArray(a)?a:[]).filter(x=>x&&x[k1]&&x[k2]).slice(0,3).map(x=>({[k1]:String(x[k1]).slice(0,120),[k2]:String(x[k2]).slice(0,240)}));
    const jokes=cl(out&&out.jokes,'q','a'),tips=cl(out&&out.tips,'t','d');if(!jokes.length&&!tips.length)throw {};
    await safe(()=>S.db.doc('config/smile').set({date:today(),jokes,tips,by:S.me||'',at:Date.now()}),'오늘 이야기를 더 가져왔어요');
  }catch(e){const c=e&&e.code;if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c))S.sample=null;toast('이야기를 가져오지 못했어요. 잠시 뒤 다시 눌러 주세요')}
  S.smileBusy=false;render()}
function vHeart(){
  let h=`<div class="sec">${subs('heart',[['smile','웃음·행복'],['lunch','점심 추천'],['gratitude','감사일기'],['praise','동료 칭찬']])}</div>`;

  <p class="muted" style="margin-top:8px">최근 약 100일 기록이 보여요.</p></section>`;

const DRIVE='Google Drive',BK_FOLDER='모델스튜디오 업무노트 백업';

const csv=rows=>rows.map(r=>r.map(v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');

async function driveBackup(){
  const step=t=>{S.bkState={busy:t};render()};
  try{
    step('기록 모으는 중…');
    const all={exportedAt:new Date().toISOString(),config:S.config};
    for(const c of COLLS.concat(['attendance','must','cleaning','lunch'],S.isBoss?['ybMoney']:[])){const s=await S.db.collection(c).get();all[c]=s.docs.map(d=>Object.assign({id:d.id},d.data()))}
    step('드라이브 폴더 찾는 중…');

    if(!root)root=await driveCall('create_file',{title:BK_FOLDER,contentMimeType:'application/vnd.google-apps.folder'});

const OKTYPE=['image/jpeg','image/png','image/webp','image/gif','application/pdf'];
async function shrink(file){ // 큰 사진·아이폰 HEIC 사진은 긴 변 2400px JPEG 로 바꿔서 올립니다
  const img=await createImageBitmap(file),k=Math.min(1,2400/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));if(!b)throw new Error('encode');
  return new File([b],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'})}
const upErr=e=>({too_large:'파일이 너무 커요 (20MB까지)',unsupported_type:'사진(JPG·PNG)이나 PDF만 올릴 수 있어요',quota_or_state:'파일 저장 공간이 가득 찼어요',rate_limited:'너무 빨리 올리고 있어요. 잠시 뒤 다시 해 주세요',upstream_auth:'로그인이 풀렸어요. 페이지를 다시 열어 주세요',not_granted:'파일을 올릴 권한이 없어요',capability_disabled:'지금은 파일을 올릴 수 없어요'}[e&&e.code]||'파일을 올리지 못했어요. 다시 시도해 주세요');
async function uploadFiles(files){
  const tok=S.formTok;
  for(const f0 of files){
    let f=f0;const heic=/hei[cf]/i.test(f.type)||/\.hei[cf]$/i.test(f.name);
    if(f.type==='application/octet-stream'||!f.type){if(/\.pdf$/i.test(f.name))f=new File([f],f.name,{type:'application/pdf'})}
    if(heic||(/^image\/(jpeg|png|webp)$/.test(f.type)&&f.size>3*1048576)){try{f=await shrink(f)}catch(e){if(heic){toast(`${f0.name}: 이 사진 형식은 열 수 없어요. JPG로 저장해서 올려 주세요`);continue}}}
    if(!OKTYPE.includes(f.type)&&!(S.formM==='posts'&&/^video\/(mp4|quicktime)$/.test(f.type))){toast(`${f0.name}: ${S.formM==='posts'?'사진이나 mp4·mov 영상만':'사진(JPG·PNG)이나 PDF만'} 올릴 수 있어요`);continue}
    if(f.size>20*1048576){toast(`${f0.name}: 20MB보다 큰 파일은 올릴 수 없어요`);continue}
    if(tok!==S.formTok)return;
    S.uploading++;drawFormFiles();
    try{const r=await S.assets.upload(f,{type:f.type});if(tok===S.formTok)S.formFiles.push({id:r.id,name:f0.name.replace(/\.hei[cf]$/i,'.jpg'),type:r.contentType||f.type,size:r.sizeBytes||f.size,at:today(),by:S.me||''})}
    catch(e){if(e&&e.code==='store_unavailable'){try{await new Promise(r=>setTimeout(r,1500));const r=await S.assets.upload(f,{type:f.type});if(tok===S.formTok)S.formFiles.push({id:r.id,name:f0.name,type:r.contentType||f.type,size:r.sizeBytes||f.size,at:today(),by:S.me||''})}catch(e2){toast(upErr(e2))}}else toast(upErr(e))}
    finally{if(tok===S.formTok){S.uploading=Math.max(0,S.uploading-1);drawFormFiles()}}
  }
  if(tok===S.formTok&&S.formFiles.length)toast('파일을 올렸어요. 저장을 눌러 주세요');
}

    else if(fb&&!s.metadata.fromCache){S.config=JSON.parse(JSON.stringify(DEFAULT_CONFIG));saveConfig()} // 새 웹사이트 첫 실행: 직원·근무시간 기본값
    S.configLoaded=true;render()},fail);
  COLLS.forEach(c=>db.collection(c).onSnapshot(s=>{got(s);S.data[c]=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()},fail));
  db.collection('attendance').orderBy('date','desc').limit(100).onSnapshot(s=>{got(s);const o={};s.docs.forEach(d=>o[d.data().date||d.id]=d.data());S.att=o;render()},fail);
  db.collection('must').orderBy('date','desc').limit(14).onSnapshot(s=>{got(s);const o={};s.docs.forEach(d=>o[d.data().date||d.id]=d.data());S.must=o;render()},fail);
  db.collection('cleaning').orderBy('date','desc').limit(14).onSnapshot(s=>{got(s);const o={};s.docs.forEach(d=>o[d.data().date||d.id]=d.data());S.clean=o;render()},fail);
  db.collection('lunch').orderBy('date','desc').limit(14).onSnapshot(s=>{got(s);const o={};s.docs.forEach(d=>o[d.data().date||d.id]=d.data());S.lunch=o;render()},fail);
})();
</script>

</body></html>
